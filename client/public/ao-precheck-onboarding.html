<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AO Precheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f7f9;--card:#fff;--card2:#fbfcfd;--line:#e7eaf0;--line2:#eef1f5;
    --ink:#0f1729;--ink2:#56607a;--ink3:#8b94a7;--ink4:#aeb6c6;
    --blue:#2f6df6;--purple:#9333ea;--grad:linear-gradient(135deg,#7c3aed,#6366f1);
    --ps:#f4eafe;--pi:#7c2fce;--bs:#eaf1fe;--bi:#1d54d6;
    --green:#16a34a;--green2:#15803d;--gs:#e7f6ec;--amber:#d97706;--as:#fbf0dd;--red:#dc2626;--rs:#fbe9e9;
    --sl:#64748b;--sls:#eef1f5;
    --sh:0 1px 2px rgba(15,23,41,.05),0 2px 8px rgba(15,23,41,.05);
    --shl:0 16px 50px rgba(15,23,41,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-text-fill-color:currentColor}
  input{font-family:inherit}
  .gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .ic{display:inline-block;vertical-align:middle;flex:none}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;font-weight:600;font-size:14px;padding:12px 20px;transition:.14s;white-space:nowrap}
  .btn.g{background:var(--grad);color:#fff;-webkit-text-fill-color:#fff}.btn.g:hover{filter:brightness(1.06);box-shadow:0 8px 22px rgba(120,60,230,.3)}
  .btn.o{background:#fff;border:1px solid var(--line);color:var(--ink);-webkit-text-fill-color:var(--ink)}.btn.o:hover{border-color:var(--purple);color:var(--pi);-webkit-text-fill-color:var(--pi)}
  .btn.green{background:var(--green);color:#fff;-webkit-text-fill-color:#fff}.btn.green:hover{background:var(--green2)}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
  .btn.lg{padding:14px 24px;font-size:15.5px}
  .btn.block{width:100%}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px}
  .c-b{background:var(--bs);color:var(--bi)}.c-g{background:var(--gs);color:var(--green2)}.c-a{background:var(--as);color:var(--amber)}.c-s{background:var(--sls);color:var(--sl)}.c-p{background:var(--ps);color:var(--pi)}
  .av{border-radius:50%;display:grid;place-items:center;color:#fff;-webkit-text-fill-color:#fff;font-weight:600;background:var(--grad);flex:none}
  .av.s{width:38px;height:38px;font-size:13px}.av.m{width:44px;height:44px;font-size:15px}
  .av.g2{background:linear-gradient(135deg,#0ea5e9,#6366f1)}.av.g3{background:linear-gradient(135deg,#10b981,#0ea5e9)}.av.g4{background:linear-gradient(135deg,#f59e0b,#ef4444)}.av.g5{background:linear-gradient(135deg,#8b5cf6,#ec4899)}

  /* auth shell */
  .auth{min-height:calc(100vh - 56px);display:grid;place-items:center;padding:34px 22px;
        background:radial-gradient(900px 460px at 50% -8%,var(--bs),transparent 60%),radial-gradient(800px 460px at 92% 108%,var(--ps),transparent 55%),var(--bg)}
  .acard{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shl);padding:32px 30px}
  .abrand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:22px}
  .wm{font-size:24px;font-weight:800;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .acard h1{font-size:22px;font-weight:800;letter-spacing:-.01em;text-align:center}
  .acard .lede{color:var(--ink2);text-align:center;font-size:14px;margin:6px 0 22px}
  .fld{margin-bottom:14px}
  .fld label{font-size:12.5px;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px}
  .inp{position:relative}
  .inp .lic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
  .inp input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 14px 12px 40px;font-size:14.5px;background:var(--card2);transition:.13s}
  .inp input:focus{outline:none;border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px var(--ps)}
  .inp.bad input{border-color:#f0b8b8;background:var(--rs)}
  .inp .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink3);padding:5px;border-radius:8px}
  .inp .eye:hover{color:var(--ink)}
  .hint{font-size:12px;color:var(--ink3);margin-top:6px}
  .err{font-size:12px;color:var(--red);margin-top:6px;display:none}
  .err.show{display:block}
  .row{display:flex;align-items:center;gap:10px}
  .alt{text-align:center;font-size:13.5px;color:var(--ink2);margin-top:18px}
  .alt a{color:var(--pi);font-weight:600;cursor:pointer}
  .between{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 16px}
  .between a{font-size:13px;color:var(--pi);font-weight:600;cursor:pointer}
  .domnote{display:flex;align-items:center;gap:8px;background:var(--bs);border:1px solid #d3e2fb;border-radius:11px;padding:10px 13px;font-size:12.5px;color:var(--bi);font-weight:500;margin-bottom:18px}

  /* stepper */
  .steps{display:flex;align-items:center;gap:8px;margin-bottom:22px;justify-content:center}
  .stp{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink3)}
  .stp .n{width:22px;height:22px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:11px;color:var(--ink3)}
  .stp.on .n{background:var(--grad);color:#fff}.stp.on{color:var(--ink)}
  .stp.dn .n{background:var(--gs);color:var(--green2)}
  .stp-sep{width:22px;height:2px;background:var(--line2)}

  /* 2FA */
  .qrwrap{display:flex;gap:18px;align-items:center;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:16px;margin-bottom:16px}
  .qr{width:128px;height:128px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;flex:none}
  .qr .grid{display:grid;width:100%;height:100%;gap:0}
  .qr .grid b{background:var(--ink)}
  .qrtxt{font-size:12.5px;color:var(--ink2);line-height:1.5}
  .secret{display:flex;align-items:center;gap:8px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;letter-spacing:.06em}
  .secret button{margin-left:auto;color:var(--ink3)}.secret button:hover{color:var(--pi)}
  .codeboxes{display:flex;gap:9px;justify-content:center;margin:6px 0 4px}
  .cbx{width:46px;height:54px;text-align:center;font-size:22px;font-weight:700;border:1px solid var(--line);border-radius:11px;background:var(--card2)}
  .cbx:focus{outline:none;border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px var(--ps)}
  .success{text-align:center}
  .scheck{width:64px;height:64px;border-radius:50%;background:var(--gs);display:grid;place-items:center;margin:0 auto 16px;color:var(--green)}

  .method{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;text-align:left;margin-bottom:12px;transition:.13s}
  .method:hover{border-color:var(--purple);box-shadow:var(--sh);transform:translateY(-1px)}
  .method .mi{width:42px;height:42px;border-radius:11px;background:var(--ps);color:var(--pi);display:grid;place-items:center;flex:none}
  .method .mtext{flex:1;min-width:0;display:flex;flex-direction:column}
  .method .mt{display:block;font-weight:700;font-size:14.5px}.method .md{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
  .method .ma{margin-left:auto;color:var(--ink4);flex:none}

  /* app shell (manager) */
  .appbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;height:60px;position:sticky;top:56px;z-index:20}
  .nav{display:flex;background:var(--sls);border-radius:11px;padding:3px;margin-left:6px}
  .nav button{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
  .nav button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
  .me{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;-webkit-text-fill-color:#fff;font-weight:600;font-size:13px;margin-left:auto}
  .mgrtag{font-size:12px;font-weight:700;color:var(--pi);background:var(--ps);padding:4px 10px;border-radius:999px}

  .page{max-width:920px;margin:24px auto;padding:0 24px}
  .ph{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .ph h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .ph .sub{color:var(--ink2);font-size:13.5px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden;margin-bottom:18px}
  .pnh{padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
  .pnh .t{font-weight:700;font-size:15px}.pnh .t small{font-weight:500;color:var(--ink3);font-size:12.5px;margin-left:6px}
  .pnb{padding:18px 20px}

  /* add-member lookup */
  .lookrow{display:flex;gap:10px}
  .lookrow .inp{flex:1}
  .result{margin-top:14px;border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;align-items:center;gap:13px;background:var(--card2)}
  .result.found{border-color:#bfe6cf;background:var(--gs)}
  .result.invite{border-color:#f0dcae;background:var(--as)}
  .result .nm{font-weight:700}.result .em{font-size:12.5px;color:var(--ink2)}
  .result .ra{margin-left:auto}

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
  th{text-align:left;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em;padding:11px 18px;background:var(--card2);border-bottom:1px solid var(--line)}
  td{padding:13px 18px;border-bottom:1px solid var(--line2)}tr:last-child td{border:none}
  .uc{display:flex;align-items:center;gap:11px}.uc .nm{font-weight:600}.uc .em{font-size:12px;color:var(--ink3)}
  .credbadge{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--pi);background:var(--ps);padding:5px 11px;border-radius:999px;font-size:13px}

  /* credits */
  .poolcard{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,#1a1f3a,#3b1f63);border-radius:16px;padding:22px 24px;color:#fff;margin-bottom:18px}
  .poolcard .pn{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .poolcard .pl{color:#c7ccec;font-size:13px;margin-top:4px}
  .poolcard .pa{margin-left:auto;display:flex;gap:10px}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff;-webkit-text-fill-color:#fff}.btn.ghost:hover{background:rgba(255,255,255,.24)}

  /* modal */
  .mbg{position:fixed;inset:0;background:rgba(15,23,41,.4);opacity:0;pointer-events:none;transition:.2s;z-index:60;display:grid;place-items:center;padding:20px}
  .mbg.show{opacity:1;pointer-events:auto}
  .modal{width:100%;max-width:420px;background:var(--card);border-radius:18px;box-shadow:var(--shl);transform:scale(.96);transition:.2s;overflow:hidden}
  .mbg.show .modal{transform:none}
  .mh{padding:18px 22px;border-bottom:1px solid var(--line2);display:flex;align-items:center}
  .mh .t{font-weight:800;font-size:17px}.mh .x{margin-left:auto;color:var(--ink3);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}.mh .x:hover{background:var(--card2)}
  .mb{padding:20px 22px}
  .bundle{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.13s}
  .bundle:hover,.bundle.sel{border-color:var(--purple);background:var(--ps)}
  .bundle .bn{font-weight:800;font-size:16px}.bundle .bp{margin-left:auto;font-weight:700;color:var(--pi)}
  .amtinp{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;padding:0 14px;background:var(--card2)}
  .amtinp input{border:none;background:none;font-size:20px;font-weight:700;padding:13px 0;width:100%;outline:none}
  .amtinp .u{color:var(--ink3);font-size:13px;font-weight:600}

  /* topbar */
  .topbar{height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:30}
  .topbar .wm{font-size:19px}

  .emailgroup{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:11px;background:var(--card2);overflow:hidden;transition:.13s}
  .emailgroup:focus-within{border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px var(--ps)}
  .emailgroup input{flex:1;min-width:0;border:none;background:none;padding:13px 6px 13px 15px;font-size:15.5px;outline:none}
  .emailgroup .suffix{display:flex;align-items:center;padding:0 15px;color:var(--ink3);font-size:14.5px;font-weight:600;white-space:nowrap;background:var(--card2);border-left:1px solid var(--line2)}
  .asuser{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px;overflow:hidden}
  .asuser a{margin-left:auto;color:var(--pi);font-weight:600;font-size:12.5px;cursor:pointer;flex:none}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;-webkit-text-fill-color:#fff;font-size:14px;font-weight:500;padding:12px 20px;border-radius:12px;box-shadow:var(--shl);opacity:0;transition:.3s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar"><span class="wm">AO Precheck</span></div>
<div id="root"></div>

<div class="mbg" id="mbg"></div>
<div class="toast" id="toast"></div>

<script>
const DOMAIN='@aoglobelife.com';
const ICONS={
 mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/>',
 phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
 lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
 key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
 card:'<rect x="1" y="4" width="22" height="16" rx="3"/><line x1="1" y1="10" x2="23" y2="10"/>',
 copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
 plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
 check:'<polyline points="20 6 9 17 4 12"/>',
 x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
 arrowRight:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
 search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
 send:'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
 eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
 building:'<rect x="4" y="2" width="16" height="20" rx="2"/><line x1="9" y1="6" x2="9" y2="6"/><line x1="15" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/>',
 transfer:'<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
 coins:'<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>',
 logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>'
};
function icon(n,sz){sz=sz||17;return '<svg class="ic" viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';}

// ---- mock data ----
let REGISTERED=[
 {nm:'Alex Rivera',em:'alex@aoglobelife.com',credits:240,av:''},
 {nm:'Mia Chen',em:'mia@aoglobelife.com',credits:180,av:'g2'},
 {nm:'Jordan Lee',em:'jordan@aoglobelife.com',credits:90,av:'g3'},
 {nm:'Casey Wood',em:'casey@aoglobelife.com',credits:320,av:'g4'},
 {nm:'Sam Patel',em:'sam@aoglobelife.com',credits:60,av:'g5'},
 {nm:'Riley Brooks',em:'riley@aoglobelife.com',credits:140,av:''},
 {nm:'Quinn Hayes',em:'quinn@aoglobelife.com',credits:25,av:'g2'}
];
let TEAM=['alex@aoglobelife.com','mia@aoglobelife.com','jordan@aoglobelife.com'];
let POOL=4820;
const TEAMNAME='Altig — Kirkland';
const ini=n=>{const p=n.trim().split(' ');return (p[0][0]||'')+(p[1]?p[1][0]:'');};
const findUser=em=>REGISTERED.find(u=>u.em.toLowerCase()===em.toLowerCase());

// ---- state ----
let screen='start', sub='form', lookEmail='', transferTo=null, buySel=5000, smsSent=false;

function go(s){screen=s;sub=(s==='signup')?'form':(s==='forgot')?'email':'form';render();}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000);}
const ok=em=>em.toLowerCase().endsWith(DOMAIN);

function render(){
  const r=document.getElementById('root');
  if(screen==='start')r.innerHTML=vStart();
  else if(screen==='signup')r.innerHTML=vSignup();
  else if(screen==='signin')r.innerHTML=vSignin();
  else if(screen==='forgot')r.innerHTML=vForgot();
  else r.innerHTML=appShell(screen==='team'?vTeam():vCredits());
}

/* ---------- START (email first) ---------- */
function vStart(){
  return authShell(`
    <h1>Enter your email to get started</h1>
    <p class="lede">Policy verification for agents and clients — sign in with your AO work email.</p>
    <div class="fld"><label>Work email</label>
      <div class="emailgroup"><input id="st_user" placeholder="yourname" autocomplete="off" spellcheck="false" oninput="sanitizeUser(this)" onkeydown="if(event.key==='Enter')startContinue()"><span class="suffix">@aoglobelife.com</span></div>
      <div class="err" id="st_err">Letters only — no spaces, numbers, or symbols.</div>
    </div>
    <button class="btn g lg block" onclick="startContinue()">Continue ${icon('arrowRight',16)}</button>
    <div class="hint" style="text-align:center;margin-top:14px">${icon('shield',14)} No email confirmation — you'll set up text login next.</div>
  `);
}

/* ---------- helpers ---------- */
function peek(id){const e=document.getElementById(id);e.type=e.type==='password'?'text':'password';}
function nextCode(el){if(el.value&&el.nextElementSibling&&el.nextElementSibling.classList.contains('cbx'))el.nextElementSibling.focus();}
