# Google Cloud Run deployment configuration for STAGING
runtime: nodejs18

env_variables:
  NODE_ENV: staging
  PORT: 5000
  # Optimize memory allocation
  NODE_OPTIONS: "--max-old-space-size=1024"

# Health check endpoint with optimized timing
liveness_check:
  path: "/health"
  check_interval_sec: 60
  timeout_sec: 30
  failure_threshold: 3

readiness_check:
  path: "/health"
  check_interval_sec: 5
  timeout_sec: 10
  failure_threshold: 2

# Resources optimized for staging workload (smaller than production)
automatic_scaling:
  min_instances: 0
  max_instances: 5
  target_cpu_utilization: 0.7
  target_throughput_utilization: 0.8

# Instance resource allocation (smaller than production)
resources:
  cpu: 1
  memory_gb: 1

